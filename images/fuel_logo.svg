<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Rich Blue Gradient background matching the prompt image -->
    <linearGradient id="fuelBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2164ff" />
      <stop offset="65%" stop-color="#194bf0" />
      <stop offset="100%" stop-color="#163ec7" />
    </linearGradient>

    <!-- Outer edge glow border -->
    <linearGradient id="fuelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Drop Shadow for elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="4" y="4" width="192" height="192" rx="54" fill="url(#fuelBgGrad)" />
  
  <!-- Subtle Highlight Edge -->
  <rect x="5.5" y="5.5" width="189" height="189" rx="52.5" fill="none" stroke="url(#fuelBorderGrad)" stroke-width="3" />

  <!-- Ticks Arc (Semi-circle around center 100, 126) -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" filter="url(#shadow)">
    <!-- 13 Radiating Ticks -->
    <line x1="43.5" y1="93.4" x2="33.8" y2="87.8" />
    <line x1="50.6" y1="83.3" x2="41.7" y2="76.0" />
    <line x1="59.4" y1="74.7" x2="51.9" y2="66.0" />
    <line x1="69.6" y1="67.7" x2="63.7" y2="57.8" />
    <line x1="80.8" y1="62.5" x2="76.5" y2="51.7" />
    <line x1="92.8" y1="59.3" x2="90.5" y2="48.1" />
    <!-- Top Center Tick -->
    <line x1="100.0" y1="58.2" x2="100.0" y2="46.8" stroke-width="5.5" />
    <line x1="107.2" y1="59.3" x2="109.5" y2="48.1" />
    <line x1="119.2" y1="62.5" x2="123.5" y2="51.7" />
    <line x1="130.4" y1="67.7" x2="136.3" y2="57.8" />
    <line x1="140.6" y1="74.7" x2="148.1" y2="66.0" />
    <line x1="149.4" y1="83.3" x2="158.3" y2="76.0" />
    <line x1="156.5" y1="93.4" x2="166.2" y2="87.8" />
  </g>

  <!-- Gas Pump Icon in Center Arc -->
  <g transform="translate(86, 68)" fill="#ffffff" filter="url(#shadow)">
    <!-- Main Pump Body -->
    <rect x="3" y="2" width="15" height="20" rx="2.5" />
    <!-- Screen -->
    <rect x="5.5" y="4.5" width="10" height="6" rx="1" fill="#194bf0" />
    <!-- Base Plate -->
    <rect x="1" y="21" width="19" height="3" rx="1" />
    <!-- Hose & Nozzle -->
    <path d="M 18 8.5 C 23.5 8.5 24.5 13 24 17.5 C 23.6 19.8 22 20.5 20.5 20.5 C 19 20.5 18.5 19.5 18.5 18 L 18.5 13.5 C 18.5 12.2 19.5 11.2 20.8 11.2 L 22.5 11.2" 
          fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Nozzle Tip -->
    <path d="M 22.5 9 L 24.5 6.5 L 26.5 6.5 L 26.5 11.5 L 24.5 11.5 Z" fill="#ffffff" />
  </g>

  <!-- E, O, F Text & Pivot -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" fill="#ffffff" filter="url(#shadow)">
    <!-- E -->
    <text x="65" y="136" font-size="30" text-anchor="middle" dominant-baseline="central">E</text>

    <!-- Center Ring 'O' Pivot -->
    <circle cx="100" cy="126" r="9.5" fill="none" stroke="#ffffff" stroke-width="5" />

    <!-- F -->
    <text x="135" y="136" font-size="30" text-anchor="middle" dominant-baseline="central">F</text>
  </g>

  <!-- Bright Red Needle Pointing to Low / Empty (E) -->
  <g filter="url(#shadow)">
    <!-- Needle Shadow Accent -->
    <line x1="94" y1="123" x2="56" y2="101" stroke="#dc2626" stroke-width="7" stroke-linecap="round" opacity="0.4" />
    <!-- Main Needle Stick -->
    <line x1="94" y1="123" x2="58" y2="99" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" />
    <!-- Needle Tail/Secondary Red Tick -->
    <line x1="68" y1="96" x2="62" y2="91" stroke="#ff3b30" stroke-width="5" stroke-linecap="round" />
    <!-- Pivot Center Red Dot -->
    <circle cx="100" cy="126" r="4.5" fill="#ff3b30" />
  </g>
</svg>
